name: Deploy GERICARE Projector to Netlify

on:
  workflow_dispatch:
  push:
    branches: [feat/projector-v2]
    paths:
      - 'apps/projector/**'
      - '.github/workflows/deploy-netlify-projector.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/projector
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GERICARE branding
        run: sed -i 's/GERiCARE/GERICARE/g' src/main.tsx index.html || true
