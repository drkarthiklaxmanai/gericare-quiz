name: Deploy GERICARE Unified Site to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'netlify.toml'
      - '.github/workflows/deploy-netlify-participant.yml'

concurrency:
  group: gericare-netlify-production
  cancel-in-progress: true

