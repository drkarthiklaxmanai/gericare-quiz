name: Deploy GERICARE Admin to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-netlify-admin.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GERICARE branding
        run: sed -i 's/GERiCARE/GERICARE/g' src/main.tsx src/auth-entry.ts index.html || true
