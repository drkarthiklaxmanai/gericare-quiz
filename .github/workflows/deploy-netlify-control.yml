name: Deploy GERICARE Control Room to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/control-room/**'
      - '.github/workflows/deploy-netlify-control.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-room
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GERICARE branding
        run: sed -i 's/GERiCARE/GERICARE/g' src/main.tsx src/auth-entry.ts index.html || true
