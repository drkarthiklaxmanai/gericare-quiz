<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GERICARE Rehearsal Console</title></head><body><div id="root"></div><script>(()=>{const re=/GERiCARE|GeriCare|GERI CARE/g,fix=n=>{if(n.nodeType===3){n.nodeValue=n.nodeValue?.replace(re,'GERICARE')??n.nodeValue;return}if(n.nodeType!==1)return;for(const a of['title','aria-label','alt','placeholder']){const v=n.getAttribute?.(a);if(v)n.setAttribute(a,v.replace(re,'GERICARE'))}n.childNodes.forEach(fix)};new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(fix))).observe(document.documentElement,{childList:true,subtree:true});document.title=document.title.replace(re,'GERICARE');fix(document.body)})()</script><script type="module" src="/src/rehearsal.tsx"></script></body></html>
