[build]
  command = "pnpm build:site"
  publish = "site-dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.15.0"

# Single production deployment: /, /control, /projector and /admin.
# Canonical nested applications.
[[redirects]]
  from = "/control"
  to = "/control/"
  status = 301

[[redirects]]
  from = "/projector"
  to = "/projector/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# SPA fallbacks. Existing JS/CSS assets take precedence because force is false.
[[redirects]]
  from = "/control/*"
  to = "/control/index.html"
  status = 200

[[redirects]]
  from = "/projector/*"
  to = "/projector/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Participant app is the root SPA. Keep this last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/control/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
