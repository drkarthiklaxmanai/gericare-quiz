[build]
  command = "pnpm --filter @gericare/participant build"
  publish = "apps/participant/dist"

[build.environment]
  NODE_VERSION = "20"

# Keep the participant app on the canonical Netlify site.
[[redirects]]
  from = "/control"
  to = "https://gericare-control-room.netlify.app"
  status = 302

[[redirects]]
  from = "/control/*"
  to = "https://gericare-control-room.netlify.app/:splat"
  status = 302

[[redirects]]
  from = "/projector"
  to = "https://gericare-projector.netlify.app"
  status = 302

[[redirects]]
  from = "/projector/*"
  to = "https://gericare-projector.netlify.app/:splat"
  status = 302

[[redirects]]
  from = "/admin"
  to = "https://gericare-admin-console.netlify.app"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "https://gericare-admin-console.netlify.app/:splat"
  status = 302

# Vite SPA fallback for the participant app. Keep this last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
